name: Build Stockroom APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StockroomAndroidProject.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'StockroomAndroidProject*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Could not find StockroomAndroidProject ZIP in repository root."
            ls -la
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          APP_GRADLE="$(find extracted -type f -path '*/app/build.gradle' -print -quit)"
          if [ -z "$APP_GRADLE" ]; then
            echo "Could not find app/build.gradle in extracted ZIP."
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Found app Gradle file but not the Android project settings file."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stockroom-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
