name: Build Stockroom APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StockroomAndroidProject.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -q StockroomAndroidProject.zip

      - name: Set Java compile target to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = list(Path("StockroomAndroid").glob("app/build.gradle*"))
          if not candidates:
              raise SystemExit("Could not find StockroomAndroid/app/build.gradle or build.gradle.kts")

          gradle_file = candidates[0]
          if gradle_file.name.endswith(".kts"):
              block = '''\n\n// Keep Java and Kotlin bytecode targets consistent.\nandroid {\n compileOptions {\n sourceCompatibility = JavaVersion.VERSION_17\n targetCompatibility = JavaVersion.VERSION_17\n }\n}\n'''
          else:
              block = '''\n\n// Keep Java and Kotlin bytecode targets consistent.\nandroid {\n compileOptions {\n sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17\n }\n}\n'''

          with gradle_file.open("a", encoding="utf-8") as f:
              f.write(block)
          print(f"Updated Java compile target in {gradle_file}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: StockroomAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stockroom-debug-apk
          path: StockroomAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
